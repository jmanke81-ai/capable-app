<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CAPABLE">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>CAPABLE Idea Finder</title>
<style>
:root {
  --navy:#1f3864; --navy2:#2e4a7a; --red:#a92a2a; --cream:#fbf7ef;
  --bg:#f3f4f6; --card:#fff; --text:#18202a; --muted:#667085; --line:#d8dde5;
  --green:#176b4d; --gold:#8a6116; --shadow:0 6px 22px rgba(22,31,48,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,Arial,sans-serif;padding-bottom:88px}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 18px}
header h1{margin:0;font-size:1.45rem;letter-spacing:.03em}
header p{margin:6px 0 0;opacity:.9;font-size:.92rem}
main{max-width:780px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0;box-shadow:var(--shadow)}
.hero{background:var(--cream)}
h2{font-size:1.12rem;margin:0 0 10px} h3{margin:0;font-size:1.05rem}
label{display:block;font-weight:700;font-size:.88rem;margin:14px 0 7px}
select,input,textarea{width:100%;font:inherit;border:1px solid #b9c0ca;border-radius:12px;background:#fff;padding:12px;color:var(--text)}
textarea{min-height:84px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.choice{border:1px solid #bcc4cf;background:#fff;color:var(--text);border-radius:12px;padding:10px 8px;font-weight:700;font-size:.86rem;min-height:44px}
.choice.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.primary{width:100%;border:0;border-radius:14px;background:var(--red);color:#fff;padding:14px;font-size:1rem;font-weight:800;margin-top:14px}
.secondary{border:1px solid #bfc6d1;background:#fff;color:var(--navy);border-radius:11px;padding:9px 11px;font-weight:750}
.ghost{border:0;background:transparent;color:var(--navy);padding:8px 3px;font-weight:750}
.result{border:1px solid var(--line);border-radius:15px;padding:14px;margin:11px 0;background:#fff}
.result-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pills{margin:8px 0 4px}
.pill{display:inline-block;border-radius:999px;background:#eef2f8;color:#31435e;padding:4px 8px;font-size:.74rem;margin:2px 4px 2px 0}
.pill.challenge{background:#fff4d8;color:#704d00}
.why{margin:10px 0 7px;line-height:1.38}
.wiser{border-left:4px solid var(--red);background:#fff8f7;padding:9px 10px;border-radius:7px;margin:8px 0;font-size:.9rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.actions button{flex:1;min-width:90px}
.muted{color:var(--muted);font-size:.86rem}
.count{font-size:.82rem;color:var(--muted);margin-top:5px}
.empty{text-align:center;color:var(--muted);padding:25px 10px}
.banner{background:#eef4ff;border:1px solid #c8d7f0;border-radius:13px;padding:11px 12px;font-size:.85rem;margin-bottom:10px}
.banner button{float:right;border:0;background:transparent;color:var(--navy);font-weight:800}
details{margin-top:10px} summary{font-weight:750;color:var(--navy);cursor:pointer}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);z-index:20}
.navbtn{border:0;background:transparent;color:#667085;font-weight:700;padding:8px 3px;font-size:.78rem}
.navbtn.active{color:var(--navy)}
.tab{display:none} .tab.active{display:block}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;text-align:center;padding:9px 4px}
.stat b{display:block;font-size:1.15rem;color:var(--navy)}
.savedrow{padding:11px 0;border-bottom:1px solid var(--line)}
.savedrow:last-child{border:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.5);display:none;align-items:flex-end;z-index:50}
.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font-size:1.2rem}
.close{float:right;border:0;background:#eef1f5;border-radius:50%;width:34px;height:34px;font-size:1.1rem}
.search{margin:0 0 10px}
.smallbtn{border:0;border-radius:10px;background:#eef2f8;color:var(--navy);padding:8px 10px;font-weight:750}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)} .row2{grid-template-columns:1fr} main{padding:10px} .card{border-radius:14px}}
</style>
</head>
<body>
<header>
  <h1>CAPABLE</h1>
  <p>Learn it. Do it. Remember it.</p>
</header>

<main>
  <div id="installBanner" class="banner">
    <button onclick="dismissInstall()">×</button>
    <b>iPhone:</b> open in Safari, tap Share, then <b>Add to Home Screen</b>.
  </div>

  <section id="tabIdeas" class="tab active">
    <div class="card hero">
      <h2>What should we do?</h2>
      <div class="count" id="libraryCount"></div>

      <label>How much time do you have?</label>
      <div class="grid" id="timeChoices">
        <button class="choice" data-minutes="15">15 min</button>
        <button class="choice" data-minutes="30">30 min</button>
        <button class="choice active" data-minutes="60">1 hour</button>
        <button class="choice" data-minutes="120">2 hours</button>
        <button class="choice" data-minutes="300">Half day</button>
        <button class="choice" data-minutes="9999">Any</button>
      </div>

      <label>What kind of activity?</label>
      <select id="typeSelect">
        <option value="Anything">Anything</option>
        <option value="Active & Healthy">Active & Healthy</option><option value="Build / Fix / Home">Build / Fix / Home</option><option value="Communication & Leadership">Communication & Leadership</option><option value="Emergency & Safety">Emergency & Safety</option><option value="Experiences & Travel">Experiences & Travel</option><option value="Faith & Character">Faith & Character</option><option value="Money & Digital">Money & Digital</option><option value="Outdoor & Adventure">Outdoor & Adventure</option><option value="Practical Life">Practical Life</option><option value="Service & Community">Service & Community</option>
      </select>

      <label>Where are you?</label>
      <select id="locationSelect">
        <option>Anywhere</option>
        <option>At home</option>
        <option>Outside</option>
        <option>Garage / workshop</option>
        <option>Church / community</option>
        <option>Around town</option>
        <option>Travel</option>
      </select>

      <details>
        <summary>More filters</summary>
        <div class="row2">
          <div>
            <label>Age</label>
            <select id="ageSelect">
              <option value="0">Any</option>
              <option value="13">13</option><option value="14">14</option><option value="15">15</option>
              <option value="16">16</option><option value="17">17</option><option value="18">18</option>
              <option value="19">19+</option>
            </select>
          </div>
          <div>
            <label>Number of ideas</label>
            <select id="countSelect"><option>3</option><option selected>5</option><option>8</option></select>
          </div>
        </div>
        <label>Search for something specific</label>
        <input id="searchInput" placeholder="tie, grill, money, bike, prayer...">
        <label style="display:flex;gap:9px;align-items:center;font-weight:650">
          <input id="hideDone" type="checkbox" checked style="width:auto"> Hide things already marked done
        </label>
      </details>

      <button class="primary" onclick="findIdeas()">Give me ideas</button>
    </div>

    <div id="resultMeta" class="muted"></div>
    <div id="results"></div>
  </section>

  <section id="tabSaved" class="tab">
    <div class="card">
      <h2>Saved for later</h2>
      <input class="search" id="savedSearch" placeholder="Search saved ideas" oninput="renderSaved()">
      <div id="savedList"></div>
    </div>
  </section>

  <section id="tabDone" class="tab">
    <div class="card">
      <h2>Done</h2>
      <div class="statrow">
        <div class="stat"><b id="doneCount">0</b><span class="muted">completed</span></div>
        <div class="stat"><b id="savedCount">0</b><span class="muted">saved</span></div>
        <div class="stat"><b id="domainCount">0</b><span class="muted">domains</span></div>
      </div>
      <div class="actions">
        <button class="secondary" onclick="exportCSV()">Export CSV</button>
        <button class="secondary" onclick="exportJSON()">Backup JSON</button>
      </div>
      <div id="doneList"></div>
    </div>
  </section>

  <section id="tabCapture" class="tab">
    <div class="card">
      <h2>Quick capture</h2>
      <p class="muted">For something life reveals that is not already in the list.</p>
      <label>Activity / capability</label>
      <input id="captureActivity" placeholder="What came up?">
      <label>Where / source</label>
      <input id="captureWhere" placeholder="Work, home, carnival, conversation...">
      <label>Why it mattered</label>
      <textarea id="captureNote" placeholder="One or two sentences is enough."></textarea>
      <button class="primary" onclick="saveCapture()">Save capture</button>
      <hr>
      <h3>Captured ideas</h3>
      <div id="captureList"></div>
    </div>
  </section>
</main>

<nav class="bottom-nav">
  <button class="navbtn active" data-tab="Ideas" onclick="showTab('Ideas')">Ideas</button>
  <button class="navbtn" data-tab="Saved" onclick="showTab('Saved')">Saved</button>
  <button class="navbtn" data-tab="Done" onclick="showTab('Done')">Done</button>
  <button class="navbtn" data-tab="Capture" onclick="showTab('Capture')">Capture</button>
</nav>

<div id="doneModal" class="modal" onclick="modalBackdrop(event)">
  <div class="sheet">
    <button class="close" onclick="closeDoneModal()">×</button>
    <h2 id="modalTitle">Mark done</h2>
    <input type="hidden" id="modalSkillId">
    <label>How did it go?</label>
    <select id="modalRating"><option value="">Not rated</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
    <label>Could he do it alone now?</label>
    <select id="modalAlone"><option value="">Not sure</option><option>Yes</option><option>No</option></select>
    <label>What happened / what did you learn?</label>
    <textarea id="modalNote" placeholder="Optional. Keep it short."></textarea>
    <button class="primary" onclick="confirmDone()">Save as done</button>
  </div>
</div>

:"Leadership","skill":"Write a Simple Product Description","age":"15-21","time":"45 min","why":"Teaches benefits vs features.","safety":"Don't exaggerate.","done":"","dateDone":"","link":"","challenge":"","minMinutes":45,"maxMinutes":45,"minAge":15,"maxAge":21,"activityType":"Communication & Leadership","locations":["Anywhere","At home"]},{"id":313,"domain":"Leadership","skill":"Understand Cost, Price, and Profit","age":"15-21","time":"30 min","why":"Connects business to real numbers.","safety":"Use simple examples.","done":"","dateDone":"","link":"","challenge":"","minMinutes":30,"maxMinutes":30,"minAge":15,"maxAge":21,"activityType":"Communication & Leadership","locations":["Anywhere","At home"]},{"id":314,"domain":"Leadership","skill":"Pack and Ship an Item","age":"14-21","time":"30 min","why":"Real-world business operation skill.","safety":"Accurate weight/dimensions.","done":"","dateDone":"","link":"","challenge":"","minMinutes":30,"maxMinutes":30,"minAge":14,"maxAge":21,"activityType":"Communication & Leadership","locations":["Anywhere","At home"]},{"id":315,"domain":"Leadership","skill":"Respond to a Customer Politely","age":"15-21","time":"30 min","why":"Teaches calm service under pressure.","safety":"Pause before responding.","done":"","dateDone":"","link":"","challenge":"","minMinutes":30,"maxMinutes":30,"minAge":15,"maxAge":21,"activityType":"Communication & Leadership","locations":["Anywhere","At home"]},{"id":316,"domain":"Leadership","skill":"Use AI to Brainstorm Responsibly","age":"14-21","time":"20 min","why":"Uses modern tools without outsourcing judgment.","safety":"Verify outputs.","done":"","dateDone":"","link":"","challenge":"","minMinutes":20,"maxMinutes":20,"minAge":14,"maxAge":21,"activityType":"Communication & Leadership","locations":["Anywhere","At home"]},{"id":317,"domain":"Leadership","skill":"Work a Scheduled Shift Reliably","age":"13-21","time":"Varies","why":"Builds reliability by arriving prepared, following instructions, staying engaged, and finishing the commitment.","safety":"Know the schedule, supervisor, assigned role, break plan, and emergency contact.","done":"","dateDone":"","link":"","challenge":"","minMinutes":15,"maxMinutes":480,"minAge":13,"maxAge":21,"activityType":"Communication & Leadership","locations":["Anywhere","At home"]},{"id":318,"domain":"Service","skill":"Reflect on Service and Contribution","age":"13-21","time":"15 min","why":"Turns service into evidence of growth by identifying what was done, how independently it was done, and who benefited.","safety":"Be honest and specific; respect other people's privacy.","done":"","dateDone":"","link":"","challenge":"","minMinutes":15,"maxMinutes":15,"minAge":13,"maxAge":21,"activityType":"Service & Community","locations":["Anywhere","Around town","Church / community"]}];
const K = {
  saved:'capable_saved_v3', done:'capable_done_v3',
  notes:'capable_notes_v3', captures:'capable_captures_v3',
  install:'capable_install_dismissed_v1'
};
let selectedMinutes=60;
let currentResults=[];

function load(key, fallback){try{return JSON.parse(localStorage.getItem(key)) ?? fallback}catch(e){return fallback}}
function save(key,val){localStorage.setItem(key,JSON.stringify(val))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function getSkill(id){return SKILLS.find(x=>x.id===Number(id))}
function isDone(id){return load(K.done,[]).some(x=>x.id===Number(id))}
function isSaved(id){return load(K.saved,[]).includes(Number(id))}

document.querySelectorAll('#timeChoices .choice').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('#timeChoices .choice').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active'); selectedMinutes=Number(btn.dataset.minutes);
}));

function scoreSkill(s, type, loc, search, age){
  let score=Math.random()*2;
  if(type!=='Anything' && s.activityType===type) score+=5;
  if(loc!=='Anywhere' && s.locations.includes(loc)) score+=5;
  if(search && (s.skill+' '+s.domain+' '+s.why).toLowerCase().includes(search)) score+=8;
  if(age && age>=s.minAge && age<=s.maxAge) score+=3;
  if(s.minMinutes<=selectedMinutes) score+=3;
  const ratio = selectedMinutes>=9999 ? 0 : Math.abs(selectedMinutes-s.minMinutes)/Math.max(selectedMinutes,1);
  score += Math.max(0,2-ratio);
  return score;
}

function findIdeas(){
  const type=document.getElementById('typeSelect').value;
  const loc=document.getElementById('locationSelect').value;
  const age=Number(document.getElementById('ageSelect').value);
  const search=document.getElementById('searchInput').value.trim().toLowerCase();
  const hideDone=document.getElementById('hideDone').checked;
  const wanted=Number(document.getElementById('countSelect').value);

  let pool=SKILLS.filter(s=>{
    if(hideDone && isDone(s.id)) return false;
    if(s.minMinutes>selectedMinutes) return false;
    if(type!=='Anything' && s.activityType!==type) return false;
    if(loc!=='Anywhere' && !s.locations.includes(loc)) return false;
    if(age && !(age>=s.minAge && age<=s.maxAge)) return false;
    if(search && !(s.skill+' '+s.domain+' '+s.why+' '+s.safety).toLowerCase().includes(search)) return false;
    return true;
  });

  let broadened=false;
  if(pool.length<wanted){
    broadened=true;
    pool=SKILLS.filter(s=>{
      if(hideDone && isDone(s.id)) return false;
      if(s.minMinutes>selectedMinutes) return false;
      if(type!=='Anything' && s.activityType!==type) return false;
      if(age && !(age>=s.minAge && age<=s.maxAge)) return false;
      if(search && !(s.skill+' '+s.domain+' '+s.why+' '+s.safety).toLowerCase().includes(search)) return false;
      return true;
    });
  }
  if(pool.length<wanted){
    pool=SKILLS.filter(s=>{
      if(hideDone && isDone(s.id)) return false;
      if(age && !(age>=s.minAge && age<=s.maxAge)) return false;
      if(search && !(s.skill+' '+s.domain+' '+s.why+' '+s.safety).toLowerCase().includes(search)) return false;
      return true;
    });
  }

  pool.sort((a,b)=>scoreSkill(b,type,loc,search,age)-scoreSkill(a,type,loc,search,age));
  currentResults=pool.slice(0,wanted);
  document.getElementById('resultMeta').textContent=currentResults.length
    ? (broadened?'Not enough exact matches, so I included a few close fits.':'')
    : 'No matches. Try Any for one of the filters.';
  renderResults();
}

function renderResults(){
  const div=document.getElementById('results');
  if(!currentResults.length){div.innerHTML='<div class="empty">Choose your time, type, and location, then tap Give me ideas.</div>';return;}
  div.innerHTML=currentResults.map((s,i)=>`
    <div class="result">
      <div class="result-head">
        <div><h3>${esc(s.skill)}</h3><div class="pills">
          <span class="pill">${esc(s.domain)}</span>
          <span class="pill">${esc(s.time)}</span>
          <span class="pill">Age ${esc(s.age)}</span>
          <span class="pill">${esc(s.activityType)}</span>
          ${s.challenge && String(s.challenge).toLowerCase()==='yes'?'<span class="pill challenge">Challenge</span>':''}
        </div></div>
        <button class="smallbtn" onclick="toggleSave(${s.id})">${isSaved(s.id)?'Saved':'Save'}</button>
      </div>
      <div class="why"><b>Why it matters:</b> ${esc(s.why)}</div>
      ${s.safety?`<div class="wiser"><b>The wiser way:</b> ${esc(s.safety)}</div>`:''}
      <div class="actions">
        <button class="secondary" onclick="openDoneModal(${s.id})">We did this</button>
        <button class="secondary" onclick="replaceIdea(${i})">Another idea</button>
      </div>
    </div>`).join('');
}

function replaceIdea(index){
  const shown=new Set(currentResults.map(x=>x.id));
  const type=document.getElementById('typeSelect').value;
  const loc=document.getElementById('locationSelect').value;
  const age=Number(document.getElementById('ageSelect').value);
  let pool=SKILLS.filter(s=>!shown.has(s.id) && !isDone(s.id) && s.minMinutes<=selectedMinutes &&
    (type==='Anything'||s.activityType===type) && (loc==='Anywhere'||s.locations.includes(loc)) &&
    (!age||(age>=s.minAge&&age<=s.maxAge)));
  if(!pool.length) pool=SKILLS.filter(s=>!shown.has(s.id) && !isDone(s.id));
  if(pool.length) currentResults[index]=pool[Math.floor(Math.random()*pool.length)];
  renderResults();
}

function toggleSave(id){
  let a=load(K.saved,[]);
  id=Number(id);
  a=a.includes(id)?a.filter(x=>x!==id):[id,...a];
  save(K.saved,a); renderResults(); renderSaved(); updateStats();
}

function openDoneModal(id){
  const s=getSkill(id);
  document.getElementById('modalSkillId').value=id;
  document.getElementById('modalTitle').textContent=s.skill;
  document.getElementById('modalRating').value='';
  document.getElementById('modalAlone').value='';
  document.getElementById('modalNote').value='';
  document.getElementById('doneModal').classList.add('open');
}
function closeDoneModal(){document.getElementById('doneModal').classList.remove('open')}
function modalBackdrop(e){if(e.target.id==='doneModal')closeDoneModal()}
function confirmDone(){
  const id=Number(document.getElementById('modalSkillId').value);
  let done=load(K.done,[]).filter(x=>x.id!==id);
  done.unshift({
    id, date:new Date().toISOString().slice(0,10),
    rating:document.getElementById('modalRating').value,
    alone:document.getElementById('modalAlone').value,
    note:document.getElementById('modalNote').value.trim()
  });
  save(K.done,done);
  closeDoneModal(); renderResults(); renderDone(); updateStats();
}

function renderSaved(){
  const q=(document.getElementById('savedSearch')?.value||'').toLowerCase();
  const ids=load(K.saved,[]);
  const list=ids.map(getSkill).filter(Boolean).filter(s=>!q||(s.skill+' '+s.domain).toLowerCase().includes(q));
  const div=document.getElementById('savedList');
  div.innerHTML=list.length?list.map(s=>`<div class="savedrow"><b>${esc(s.skill)}</b><div class="muted">${esc(s.domain)} · ${esc(s.time)}</div><div class="actions"><button class="secondary" onclick="openDoneModal(${s.id})">We did this</button><button class="ghost" onclick="toggleSave(${s.id})">Remove</button></div></div>`).join(''):'<div class="empty">Nothing saved yet.</div>';
}

function renderDone(){
  const done=load(K.done,[]);
  const div=document.getElementById('doneList');
  div.innerHTML=done.length?done.map(d=>{
    const s=getSkill(d.id); if(!s)return '';
    return `<div class="savedrow"><b>${esc(s.skill)}</b><div class="muted">${esc(d.date)} · ${esc(s.domain)} · ${esc(s.time)}</div>
      ${d.note?`<div class="why">${esc(d.note)}</div>`:''}
      <div class="pills">${d.rating?`<span class="pill">Rating ${esc(d.rating)}/5</span>`:''}${d.alone?`<span class="pill">Alone: ${esc(d.alone)}</span>`:''}</div>
      <button class="ghost" onclick="undoDone(${d.id})">Undo</button></div>`;
  }).join(''):'<div class="empty">Nothing marked done yet.</div>';
}
function undoDone(id){save(K.done,load(K.done,[]).filter(x=>x.id!==Number(id)));renderDone();updateStats();renderResults()}

function saveCapture(){
  const activity=document.getElementById('captureActivity').value.trim();
  if(!activity){alert('Add the activity first.');return;}
  let a=load(K.captures,[]);
  a.unshift({id:Date.now(),date:new Date().toISOString().slice(0,10),activity,
    where:document.getElementById('captureWhere').value.trim(),
    note:document.getElementById('captureNote').value.trim()});
  save(K.captures,a);
  document.getElementById('captureActivity').value='';
  document.getElementById('captureWhere').value='';
  document.getElementById('captureNote').value='';
  renderCaptures();
}
function renderCaptures(){
  const a=load(K.captures,[]);
  document.getElementById('captureList').innerHTML=a.length?a.map(x=>`<div class="savedrow"><b>${esc(x.activity)}</b><div class="muted">${esc(x.date)}${x.where?' · '+esc(x.where):''}</div>${x.note?`<div class="why">${esc(x.note)}</div>`:''}<button class="ghost" onclick="deleteCapture(${x.id})">Delete</button></div>`).join(''):'<div class="empty">No captures yet.</div>';
}
function deleteCapture(id){save(K.captures,load(K.captures,[]).filter(x=>x.id!==id));renderCaptures()}

function updateStats(){
  const done=load(K.done,[]), saved=load(K.saved,[]);
  document.getElementById('doneCount').textContent=done.length;
  document.getElementById('savedCount').textContent=saved.length;
  document.getElementById('domainCount').textContent=new Set(done.map(x=>getSkill(x.id)?.domain).filter(Boolean)).size;
  document.getElementById('libraryCount').textContent=`${SKILLS.length} CAPABLE ideas in your current skill list`;
}

function showTab(name){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('tab'+name).classList.add('active');
  document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));
  if(name==='Saved')renderSaved();
  if(name==='Done')renderDone();
  if(name==='Capture')renderCaptures();
  window.scrollTo({top:0,behavior:'smooth'});
}

function exportCSV(){
  const done=load(K.done,[]);
  const rows=[['Date','Skill','Domain','Time','Rating','Alone Now','Note']];
  done.forEach(d=>{const s=getSkill(d.id);if(s)rows.push([d.date,s.skill,s.domain,s.time,d.rating,d.alone,d.note])});
  const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  download('CAPABLE_progress.csv',csv,'text/csv');
}
function exportJSON(){
  download('CAPABLE_backup.json',JSON.stringify({done:load(K.done,[]),saved:load(K.saved,[]),captures:load(K.captures,[])},null,2),'application/json');
}
function download(name,content,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
function dismissInstall(){localStorage.setItem(K.install,'1');document.getElementById('installBanner').style.display='none'}

if(localStorage.getItem(K.install))document.getElementById('installBanner').style.display='none';
updateStats(); renderResults(); renderSaved(); renderDone(); renderCaptures();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
